name: release dispatch
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      apk_name: ${{ steps.rename_apk.outputs.apk_name }}
      apk_artifact_url: ${{ steps.upload_apk.outputs.artifact-url }}
    env:
      GRADLE_OPTS: -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.incremental=false -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4500m"
      DEBUG_KEYSTORE_FILE: debug.keystore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
#      - run: ./gradlew ktlintCheck --continue
      - run: ./gradlew assembleDebug
      - id: rename_apk
        name: Rename APK
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          REPO_SIMPLE_NAME="${REPOSITORY##*/}"
          SAFE_BRANCH="${BRANCH_NAME//\//-}"
          APK_NAME="app-${REPO_SIMPLE_NAME}-${SAFE_BRANCH}-${SHORT_SHA}.apk"

          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          mv "$APK_PATH" "app/build/outputs/apk/debug/$APK_NAME"

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=app/build/outputs/apk/debug/$APK_NAME" >> "$GITHUB_OUTPUT"
      - id: upload_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.rename_apk.outputs.apk_path }}
          archive: false
      - run: ./gradlew lintDebug
      - run: ./gradlew testDebugUnitTest

  # PR のコードを OIDC トークンや PR への書き込み権限がある環境で実行しないよう、
  # 配布はチェックアウトせずビルド済み APK だけを受け取るジョブで行う
  distribute:
    needs: check
    if: >-
      !cancelled() && needs.check.outputs.apk_artifact_url != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.check.outputs.apk_name }}
      - id: upload_s3
        name: Upload APK to S3
        uses: matsudamper/actions/upload-matsudamper-s3@a1ecf81b1a0ce320824a49711e456f396e4e8fea
        continue-on-error: true
        with:
          file_path: ${{ needs.check.outputs.apk_name }}
      - id: github_qr_artifact
        name: Upload GitHub QR code
        if: github.event_name == 'pull_request'
        uses: matsudamper/actions/upload-qr-code@7577a0a7bddd81843525c1f8539b119bdaa7825c # v1.1.0
        with:
          url: ${{ needs.check.outputs.apk_artifact_url }}
          output_path: qrcode-github.png
          artifact_name: apk-qr-code-github
      - id: s3_qr_artifact
        name: Upload S3 QR code
        if: github.event_name == 'pull_request' && steps.upload_s3.outputs.url != ''
        uses: matsudamper/actions/upload-qr-code@7577a0a7bddd81843525c1f8539b119bdaa7825c # v1.1.0
        with:
          url: ${{ steps.upload_s3.outputs.url }}
          output_path: qrcode-s3.png
          artifact_name: apk-qr-code-s3
      - name: Comment APK download URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: apk-download
          recreate: true
          message: |
            ✅ **Debug APK is ready!**

            | Storage | Download Link | QR Code |
            | :--- | :--- | :--- |
            | 🐙 GitHub Artifacts | [Download](${{ needs.check.outputs.apk_artifact_url }}) | [View](${{ steps.github_qr_artifact.outputs.artifact-url }}) |
            ${{ steps.upload_s3.outputs.url && format('| ☁️ S3 | [Download]({0}) | [View]({1}) |', steps.upload_s3.outputs.url, steps.s3_qr_artifact.outputs.artifact-url) || '' }}

            ---
            *Artifact Name: `${{ needs.check.outputs.apk_name }}`*

  # PR と同じビルド済み APK（同じ署名・バージョン）をそのまま配布する
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.check.outputs.apk_name }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ needs.check.outputs.apk_name }}
        run: |
          # 連続 push で古い実行が後から完了したとき、古い APK を Latest にしない
          MAIN_HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$MAIN_HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "main が $MAIN_HEAD_SHA に進んでいるためリリースをスキップする"
            exit 0
          fi
          RELEASE_TAG=$(TZ=Asia/Tokyo date +%Y%m%d-%H%M%S)
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
